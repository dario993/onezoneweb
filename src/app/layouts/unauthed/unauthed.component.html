<!-- Main Container -->
<div class="flex flex-col min-h-screen bg-gradient-to-b from-white to-gray-100">
  <!-- Header with Logo and Close Button -->
  <header
    class="flex justify-between items-center p-5 bg-gray-100"
    *ngIf="navigator.inMenu"
  >
    <!-- Company Logo -->
    <div class="flex items-center">
      <img
        src="assets/images/onezone-logo-pos-RGB.svg"
        alt="OneZone Logo"
        class="h-4"
      />
    </div>

    <!-- Close Button -->
    <button
      (click)="navigator.back()"
      class="p-1 hover:bg-gray-200 rounded-full transition-colors"
      aria-label="Close"
    >
      <img
        src="assets/icons/ozo/times-light-blue.png"
        alt="Close"
        class="h-5"
      />
    </button>
  </header>

  <!-- Main Content Area with Scroll -->
  <main class="flex-1 overflow-y-auto bg-gradient-to-b from-white to-gray-100">
    <router-outlet></router-outlet>
  </main>

  <!-- Bottom Navigation Menu -->
  <nav *ngIf="!hideFooterNav" class="grid grid-cols-3 bg-gradient-to-b from-white to-gray-100">
    <!-- Support Button -->
    <button
      (click)="openFooterLink('support')"
      class="flex flex-col items-center justify-center h-16 text-white bg-gradient-to-b from-blue-900 to-blue-700 font-bold text-sm hover:from-blue-800 hover:to-blue-600 transition-all"
    >
      <img
        src="assets/icons/ozo/phone-flip-light-white.png"
        alt="Support"
        class="h-3.5 mb-1"
      />
      <span>{{ "menu.support" | i18n }}</span>
    </button>

    <!-- OneZone Link Button -->
    <button
      (click)="openFooterLink('onezone')"
      class="flex flex-col items-center justify-center h-16 text-blue-900 bg-gradient-to-b from-white to-gray-100 font-bold text-sm hover:bg-gradient-to-b hover:from-gray-50 hover:to-gray-200 transition-all"
    >
      <img
        src="assets/icons/ozo/arrow-up-right-from-square-light.png"
        alt="OneZone"
        class="h-3.5 mb-1"
      />
      <span>{{ "menu.onezone" | i18n }}</span>
    </button>

    <!-- Language Button -->
    <button
      (click)="openFooterLink('i18n')"
      class="flex flex-col items-center justify-center h-16 text-blue-900 bg-gradient-to-b from-white to-gray-100 font-bold text-sm hover:bg-gradient-to-b hover:from-gray-50 hover:to-gray-200 transition-all"
    >
      <img
        src="assets/icons/ozo/globe-light.png"
        alt="Language"
        class="h-3.5 mb-1"
      />
      <span>{{ "menu.lang" | i18n }}</span>
    </button>
  </nav>
</div>

<!-- Loading Overlay -->
<div
  class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50"
  *ngIf="loaderService.loading$ | async"
>
  <img
    #loadingImage
    src="assets/logo.png"
    alt="Loading"
    class="h-12 w-12 animate-spin"
  />
</div>
