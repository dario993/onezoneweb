<!-- Menu Container -->
<div class="flex flex-col min-h-screen bg-gradient-to-b from-white to-gray-100">
  <!-- Main Menu Content -->
  <div class="flex-1 px-6 py-6">
    <!-- Menu Items List -->
    @if (menu.length > 0) {
    <div class="bg-white rounded-lg shadow-sm overflow-hidden">
      @for (entry of menu; track $index; let last = $last) {
      <div
        class="flex items-center justify-between p-4 hover:bg-gray-50 transition-colors cursor-pointer"
        [class.border-b]="!last"
        [class.border-gray-200]="!last"
        (click)="navigator.navigateTo(entry['url'][i18n.currentLanguage])"
      >
        <span class="text-gray-800 font-semibold text-sm">{{
          entry["name"][i18n.currentLanguage]
        }}</span>
        <img
          src="assets/icons/ozo/chevron-right-solid.png"
          alt="Go to"
          class="h-3 opacity-60"
        />
      </div>
      }
    </div>
    }
  </div>

  <!-- Bottom Actions -->
  <div class="px-6 pb-6">
    <div class="bg-white rounded-lg shadow-sm overflow-hidden">
      <!-- Gestione Consulenti (admin only) -->
      @if (isAdminUser) {
      <button
        (click)="navigator.navigateTo('consultant-automation')"
        class="w-full flex items-center justify-between p-4 hover:bg-gray-50 transition-colors text-left border-b border-gray-200"
      >
        <span class="text-gray-800 font-semibold text-sm">Gestione consulenti</span>
        <img
          src="assets/icons/ozo/chevron-right-solid.png"
          alt="Go to"
          class="h-3 opacity-60"
        />
      </button>
      }

      <!-- Logout Button -->
      <button
        (click)="logout()"
        class="w-full flex items-center justify-between p-4 hover:bg-gray-50 transition-colors text-left border-b border-gray-200"
      >
        <span class="text-red-600 font-bold text-sm">{{
          "nav.logout" | i18n
        }}</span>
        <img
          src="assets/icons/ozo/sign-out-alt-light.png"
          alt="Logout"
          class="h-4 w-4 opacity-60"
        />
      </button>

      <!-- OneZone Web Link -->
      <button
        (click)="openOneZoneWeb()"
        class="w-full flex items-center justify-between p-4 hover:bg-gray-50 transition-colors text-left"
      >
        <span class="text-gray-800 text-sm">{{ "nav.web" | i18n }}</span>
        <img
          src="assets/icons/ozo/arrow-up-right-from-square-light.png"
          alt="External link"
          class="h-3 w-3 opacity-60"
        />
      </button>
    </div>
  </div>
</div>
