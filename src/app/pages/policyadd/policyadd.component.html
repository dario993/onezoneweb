<div class="flex flex-col h-full">
  <!-- Header -->
  <div class="relative">
    <div class="h-24 bg-gradient-to-b from-blue-900 to-blue-700"></div>
    <div class="absolute inset-0 flex items-center justify-center">
      <h1 class="text-xl font-medium text-white px-4 text-center">
        {{ "policy-add.title" | i18n }}
      </h1>
    </div>
  </div>

  <!-- Content -->
  <div class="flex-1 p-4">
    <!-- Description Text -->
    <p class="text-sm text-gray-700 mb-6 leading-relaxed">
      {{ "policy-add.text" | i18n }}
    </p>

    <!-- Insurance Selection List -->
    <div class="bg-white rounded-lg shadow-md p-4 mb-6">
      <div class="max-h-80 overflow-y-auto space-y-3">
        @for (insurance of insurances; track insurance.id) {
        <button
          class="w-full p-3 rounded-lg border transition-all duration-200 text-left"
          [class.bg-blue-100]="insurance.selected"
          [class.border-blue-500]="insurance.selected"
          [class.text-blue-900]="insurance.selected"
          [class.bg-gray-50]="!insurance.selected"
          [class.border-gray-200]="!insurance.selected"
          [class.text-gray-900]="!insurance.selected"
          [class.hover:bg-blue-50]="!insurance.selected"
          [class.hover:border-blue-300]="!insurance.selected"
          (click)="insurance.selected = !insurance.selected"
        >
          <div class="flex items-center justify-between">
            <span class="font-medium truncate">{{ insurance.name }}</span>
            @if (insurance.selected) {
            <div
              class="w-5 h-5 bg-blue-500 rounded-full flex items-center justify-center"
            >
              <svg
                class="w-3 h-3 text-white"
                fill="currentColor"
                viewBox="0 0 20 20"
              >
                <path
                  fill-rule="evenodd"
                  d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"
                  clip-rule="evenodd"
                ></path>
              </svg>
            </div>
            } @else {
            <div class="w-5 h-5 border-2 border-gray-300 rounded-full"></div>
            }
          </div>
        </button>
        }
      </div>
    </div>

    <!-- Submit Button -->
    <button
      class="w-full bg-orange-500 hover:bg-orange-600 text-white font-medium py-3 px-4 rounded-lg transition-colors duration-200 shadow-md hover:shadow-lg"
      (click)="submit()"
    >
      {{ "policy-add.button" | i18n }}
    </button>
  </div>
</div>
